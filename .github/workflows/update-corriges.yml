name: Weekly Repository Update

on:
  schedule:
    # minute hour dayOfMonth month dayOfWeek
    # Every Tue-Fri at 16:00 UTC
    - cron: '0 16 * 9-12 2-5'
  workflow_dispatch:
    # Manual dispatch
    inputs:
      dry_run:
        description: 'Dry run mode'
        required: false
        default: 'true'
        type: choice
        options:
        - true
        - false
      today:
        description: 'Date'
        required: false
        default:
        type: string

permissions:
  contents: write
  pull-requests: none
  issues: none
  actions: none
  checks: none
  deployments: none
  discussions: none
  packages: none
  statuses: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_repository:
    name: Update Repository
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check-out downstream
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main
          path: downstream

      - name: Check-out upstream
        uses: actions/checkout@v5
        with:
          repository: eng209/cours-en-coulisses
          fetch-depth: 1
          ref: main
          path: upstream
          token: ${{ secrets.GH_PAT }}

      - name: Downstream files (before)
        run: |
          cd ${{ github.workspace }}/downstream
          git ls-files

      - name: Set up Git
        run: |
          cd ${{ github.workspace }}/downstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Copy upstream to downstream
        run: |
          set -eu
          cd ${{ github.workspace }}/downstream
          if [[ "${{ inputs.today }}"  =~ ^([0-9]{4})[-./]([0-9]{2})[-./]([0-9]{2})$ ]]; then
            current_date=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}
          else
            current_date=$(date +"%Y.%m.%d")
          fi
          echo "Running for date: $current_date"
          find_regex=$(
            awk -v today="${current_date}" '
              /^#/ { next }
              BEGIN { r_expr="" }
              $1 <= today {
                inc=""; isp=""; exc=""; esp=""
                for (i=2; i<=NF; ++i) {
                  if (substr($i,1,1) == "!") {
                    exc = exc " " esp " -not -regex " substr($i,2)
                    esp=" -and "
                  } else {
                    inc = inc " " isp " -regex " $i
                    isp=" -or "
                  }
                }
                if (length(inc)>0) {
                  if (length(r_expr) > 0) {
                    r_expr = r_expr " -or "
                  }
                  r_expr = r_expr  " ( "  inc  " ) "
                  if (length(exc)>0) {
                    r_expr = r_expr " -and " exc
                  }
                }
              }
              END { print r_expr }
            ' ${{ github.workspace }}/downstream/.github/workflows/schedule.txt
          )

          if [[ -n "${find_regex:-}" ]]; then   
            (find "${{ github.workspace }}/upstream" -type f ${find_regex} || true) |
            while read -r file; do
              relative_path="${file#${{ github.workspace }}/upstream/}"
              target_dir="${{ github.workspace }}/downstream/$(dirname "${relative_path}")"
              mkdir -p "${target_dir}"
                echo "${file} -> ${target_dir}/"
                cp --recursive --update=none "${file}" "${target_dir}/"
            done
          fi

      - name: Commit and push changes
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          cd ${{ github.workspace }}/downstream
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git status
            git commit -m "bot: update $(date +'%Y.%m.%d')"
            if [[ "${DRY_RUN}" == "false" ]]; then
                git push origin main
            else
                echo [Dry run] git push origin main
            fi
          fi

      - name: Downstream files (after)
        run: |
          cd ${{ github.workspace }}/downstream
          git ls-files

